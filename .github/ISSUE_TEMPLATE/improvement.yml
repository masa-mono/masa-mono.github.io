name: Improvement request
description: Suggest a site or workflow improvement
title: "Improve: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Describe the desired outcome and any alternatives considered.
    validations:
      required: true
